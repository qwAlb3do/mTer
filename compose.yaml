services:
  volume-init:
    image: alpine:3.22
    command: sh -c 'mkdir -p /shared/videos /app/database /app/logs && chown -R ${BOT_UID:-1000}:${BOT_GID:-1000} /shared/videos /app/database /app/logs'
    volumes:
      - ./shared/videos:/shared/videos
      - ./database:/app/database
      - ./logs:/app/logs
    restart: "no"

  telegram-bot-api:
    image: aiogram/telegram-bot-api:10.0
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?Set TELEGRAM_API_ID in .env}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?Set TELEGRAM_API_HASH in .env}
      TELEGRAM_LOCAL: "1"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
      - ./shared/videos:/shared/videos:ro
    networks:
      - bot-network
    depends_on:
      volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8081"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    user: "${BOT_UID:-1000}:${BOT_GID:-1000}"
    group_add:
      - "101"
    env_file:
      - .env
    environment:
      TELEGRAM_BOT_API_URL: http://telegram-bot-api:8081
      TELEGRAM_BASE_URL: http://telegram-bot-api:8081/bot
      TELEGRAM_BASE_FILE_URL: http://telegram-bot-api:8081/file/bot
      DOWNLOAD_DIR: /shared/videos
      LOG_DIR: /app/logs
      USERS_FILE: /app/database/users.json
      YTDLP_COOKIES_FILE: /run/secrets/youtube-cookies.txt
      YTDLP_JS_RUNTIMES: node:/usr/bin/node
    volumes:
      - ./shared/videos:/shared/videos
      - ./database:/app/database
      - ./logs:/app/logs
      - telegram-bot-api-data:/var/lib/telegram-bot-api:ro
      - ./secrets:/run/secrets:ro
    networks:
      - bot-network
    depends_on:
      volume-init:
        condition: service_completed_successfully
      telegram-bot-api:
        condition: service_healthy
    restart: unless-stopped

networks:
  bot-network:
    driver: bridge

volumes:
  telegram-bot-api-data:
